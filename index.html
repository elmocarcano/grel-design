  .th-in.on>*:nth-child(2){transition-delay:.08s}.th-in.on>*:nth-child(3){transition-delay:.16s}.th-in.on>*:nth-child(4){transition-delay:.24s}.th-in.on>*:nth-child(5){transition-delay:.32s}.th-in.on>*:nth-child(6){transition-delay:.4s}
  .th-verb>img{transform:scale(1.08);transition:transform 1.6s cubic-bezier(.2,.7,.2,1)}.th-verb.on>img{transform:none}
  .th-foot>img{animation:thDrift 24s ease-in-out infinite alternate}
}
@keyframes thShutter{from{clip-path:inset(0 100% 0 0);transform:scale(1.12)}to{clip-path:inset(0 0 0 0);transform:none}}

function plateShape(kind){
  const s=new THREE.Shape(),e=Math.asin(1/30);
  s.moveTo(-35,0);
  if(kind==='A'){s.lineTo(-1,0);s.lineTo(-1,5);s.lineTo(1,5);s.lineTo(1,0)}
  s.lineTo(35,0);s.lineTo(35,40);s.lineTo(30,40);
  if(kind==='A'){s.absarc(0,40,30,0,PI,true)}
  else{
    s.absarc(0,40,30,0,-(PI/2-e),true);
    s.lineTo(1,5);s.lineTo(-1,5);s.lineTo(-1,40-30*Math.cos(e));
    s.absarc(0,40,30,-(PI/2+e),-PI,true);
  }

  return s;
}
function splitGeo(geo,endX){
  const pos=geo.attributes.position.array,nor=geo.attributes.normal.array,uv=geo.attributes.uv.array;
  const buckets=[[],[],[]];
  geo.groups.forEach(gr=>{
    for(let t=gr.start/3;t<(gr.start+gr.count)/3;t++){
      let b=gr.materialIndex;
      if(b===1){
        let all=true;
        for(let k=0;k<3;k++){if(Math.abs(pos[(t*3+k)*3])<endX)all=false}
        if(all)b=2;
      }
      buckets[b].push(t);
    }
  });
  const P=[],N=[],UV=[];const ng=new THREE.BufferGeometry();let start=0;const groups=[];
  buckets.forEach((arr,mi)=>{
    arr.forEach(t=>{for(let k=0;k<3;k++){const v=t*3+k;P.push(pos[v*3],pos[v*3+1],pos[v*3+2]);N.push(nor[v*3],nor[v*3+1],nor[v*3+2]);UV.push(uv[v*2],uv[v*2+1])}});
    groups.push([start,arr.length*3,mi]);start+=arr.length*3;
  });

  ng.setAttribute('normal',new THREE.Float32BufferAttribute(N,3));

function cv(size){const c=document.createElement('canvas');c.width=c.height=size;return c}

  const c=cv(size),x=c.getContext('2d');x.fillStyle='#D9BC8E';x.fillRect(0,0,size,size);
  let s=13;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;

}

      const M=THREE.MirroredRepeatWrapping;
      this.wood.image=t.image;this.wood.wrapS=this.wood.wrapT=M;this.wood.repeat.set(1/25.3,1/40);this.wood.needsUpdate=true;
      this.woodDisc.image=t.image;this.woodDisc.wrapS=this.woodDisc.wrapT=M;this.woodDisc.center.set(.5,.5);this.woodDisc.rotation=Math.PI/2;
      this.woodDisc.repeat.set(60/25.3,60/40);this.woodDisc.needsUpdate=true});
    /* parts */
    const ex=k=>new THREE.ExtrudeGeometry(plateShape(k),{depth:2,bevelEnabled:false,curveSegments:110}).translate(0,0,-1);
    this.A=new THREE.Group();this.B=new THREE.Group();this.D=new THREE.Group();
    const mA=new THREE.Mesh(splitGeo(ex('A'),34.9),[this.mBody,this.mBody,this.mBody]);
    const mB=new THREE.Mesh(splitGeo(ex('B'),34.9),[this.mBody,this.mBody,this.mAcc]);
    [mA,mB].forEach(m=>{m.castShadow=true;m.receiveShadow=true});
    this.A.add(mA);this.B.add(mB);
    this.spinG=new THREE.Group();this.flipG=new THREE.Group();
    const disc=new THREE.Mesh(new THREE.CylinderGeometry(30,30,2,180),[this.o.edgeAcc?this.mAcc:this.mBody,this.mTop,this.mBot]);disc.castShadow=true;disc.receiveShadow=true;
    this.flipG.add(disc);this.spinG.add(this.flipG);this.D.add(this.spinG);
    this.scene.add(this.A,this.B,this.D);
    /* state */
    this.cur={body:new THREE.Color(0x252525),acc:new THREE.Color(0x8fd9cf)};this.tar={body:new THREE.Color(0x252525),acc:new THREE.Color(0x8fd9cf)};
    this.conf={oak:false,surface:'none',body:'#252525',accent:'#8FD9CF'};
    this.spinA=0;this.spinT=0;this.spinAnim=null;this.flipA=0;this.flipAnim=null;this.flipT=0;
    const P=POSES[this.o.pose];this.applyPose(P,P,1);
    this.cam=Object.assign({},P.cam,{t:P.cam.t.slice()});
    if(this.o.phi!=null)this.cam.phi=this.o.phi;if(this.o.theta!=null)this.cam.theta=this.o.theta;
    this.vel=0;this.drag=null;this.autoRot=this.o.auto;this.tw=null;this.visible=false;this.aspectK=1;this.poseName=this.o.pose;
    if(this.o.interactive)this.bindDrag();
    this.ro=new ResizeObserver(()=>this.resize());this.ro.observe(host);this.resize();
    this.io=new IntersectionObserver(es=>{this.visible=es[0].isIntersecting;if(this.visible)this.frame(performance.now())},{rootMargin:'120px'});this.io.observe(host);
    LOOP.add(this);
  }
  bindDrag(){
    const c=this.canvas;
    c.addEventListener('pointerdown',e=>{this.drag={x:e.clientX,y:e.clientY};this.autoRot=false;this.vel=0;try{c.setPointerCapture(e.pointerId)}catch(_){}});
    c.addEventListener('pointermove',e=>{if(!this.drag)return;const dx=e.clientX-this.drag.x,dy=e.clientY-this.drag.y;this.drag={x:e.clientX,y:e.clientY};this.cam.theta-=dx*.0075;this.vel=-dx*.0075;this.cam.phi=clamp(this.cam.phi-dy*.005,.28,1.46)});
    const up=()=>{this.drag=null};c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
  }
  resize(){
    const w=this.host.clientWidth,h=this.host.clientHeight;if(!w||!h)return;
    this.r.setSize(w,h,false);this.camera.aspect=w/h;this.aspectK=Math.max(1,1.12/(w/h));this.camera.updateProjectionMatrix();
  }
  applyPose(a,b,e){
    ['A','B','D'].forEach(k=>{
      const g=this[k],pa=a[k],pb=b[k];
      g.position.set(pa.p[0]+(pb.p[0]-pa.p[0])*e,pa.p[1]+(pb.p[1]-pa.p[1])*e,pa.p[2]+(pb.p[2]-pa.p[2])*e);
      if(k!=='D'){const q0=new THREE.Quaternion().setFromEuler(new THREE.Euler(...pa.q,'YXZ')),q1=new THREE.Quaternion().setFromEuler(new THREE.Euler(...pb.q,'YXZ'));g.quaternion.copy(q0).slerp(q1,e)}
    });
  }
  setPose(name,dur=1300){
    if(this.dead)return;const to=POSES[name];if(!to)return;
    const from={A:{p:this.A.position.toArray(),q:new THREE.Euler().setFromQuaternion(this.A.quaternion,'YXZ').toArray().slice(0,3)},
      B:{p:this.B.position.toArray(),q:new THREE.Euler().setFromQuaternion(this.B.quaternion,'YXZ').toArray().slice(0,3)},D:{p:this.D.position.toArray()},cam:Object.assign({},this.cam,{t:this.cam.t.slice()})};
    this.tw={from,to,t0:performance.now(),dur};this.poseName=name;this.autoRot=false;
  }
  setConfig(c){
    if(this.dead)return;this.conf=Object.assign(this.conf,c);const d=this.conf;
    this.tar.body.set(d.oak?0xffffff:d.body);this.tar.acc.set(d.oak?0xffffff:d.accent);
    const oak=d.oak;
    const set=(m,map)=>{if(m.map!==map){m.map=map;m.needsUpdate=true}};
    set(this.mBody,oak?this.wood:null);set(this.mAcc,oak?this.wood:null);
    const surface=this.o.chessDemo?'chess':(d.surface||'none');
    set(this.mTop,oak?this.woodDisc:this.logoTex);
    if(surface==='chess'||surface==='cards'){
      const canvas=surface==='chess'?chessCanvas(oak?'#DCBF92':d.accent,oak?'#A47C4C':d.body):cardsCanvas();
      const t=new THREE.CanvasTexture(canvas);t.anisotropy=4;
      if(this.surfaceTex)this.surfaceTex.dispose();this.surfaceTex=t;set(this.mBot,t);
    }else set(this.mBot,oak?this.woodDisc:this.logoTex);
    this.surfaceOn=surface==='chess'||surface==='cards';
  }
  spin(){this.spinT+=PI/2;this.spinAnim={t0:performance.now(),from:this.spinA,to:this.spinT,dur:1000}}
  flip(){this.flipT=this.flipT?0:PI;this.flipAnim={t0:performance.now(),from:this.flipA,to:this.flipT,dur:1300}}
  frame(now){
    if(this.dead)return;
    const k=.14;this.cur.body.lerp(this.tar.body,k);this.cur.acc.lerp(this.tar.acc,k);
    this.mBody.color.copy(this.cur.body);this.mAcc.color.copy(this.cur.acc);this.mTop.color.copy(this.cur.acc);
    if(this.surfaceOn)this.mBot.color.set(0xffffff);else this.mBot.color.copy(this.cur.body);
    if(this.tw){
      const t=clamp((now-this.tw.t0)/this.tw.dur),e=ease(t),{from,to}=this.tw;
      this.applyPose(from,to,e);
      const a=from.cam,b=to.cam;this.cam.phi=a.phi+(b.phi-a.phi)*e;this.cam.radius=a.radius+(b.radius-a.radius)*e;
      this.cam.theta=a.theta+(b.theta-a.theta)*e;
      for(let i=0;i<3;i++)this.cam.t[i]=a.t[i]+(b.t[i]-a.t[i])*e;
      if(t>=1)this.tw=null;
    }
    if(this.spinAnim){const t=clamp((now-this.spinAnim.t0)/this.spinAnim.dur);this.spinA=this.spinAnim.from+(this.spinAnim.to-this.spinAnim.from)*ease(t);if(t>=1)this.spinAnim=null;this.spinG.rotation.y=this.spinA}
    if(this.flipAnim){const t=clamp((now-this.flipAnim.t0)/this.flipAnim.dur);this.flipA=this.flipAnim.from+(this.flipAnim.to-this.flipAnim.from)*ease(t);this.flipG.position.y=Math.sin(t*PI)*24;if(t>=1){this.flipAnim=null;this.flipG.position.y=0}this.flipG.rotation.x=this.flipA}
    if(!this.drag){
      if(Math.abs(this.vel)>1e-4){this.cam.theta+=this.vel;this.vel*=.93}
      else if(this.autoRot&&!this.tw&&!matchMedia('(prefers-reduced-motion:reduce)').matches)this.cam.theta+=.0022;
    }
    const c=this.cam,R=c.radius*this.aspectK;
    this.camera.position.set(c.t[0]+R*Math.sin(c.phi)*Math.sin(c.theta),c.t[1]+R*Math.cos(c.phi),c.t[2]+R*Math.sin(c.phi)*Math.cos(c.theta));
    this.camera.lookAt(c.t[0],c.t[1],c.t[2]);
    this.r.render(this.scene,this.camera);
  }
  dispose(){
    LOOP.del(this);if(this.dead)return;this.ro.disconnect();this.io.disconnect();
    this.scene.traverse(o=>{if(o.geometry)o.geometry.dispose()});[this.mBody,this.mAcc,this.mTop,this.mBot].forEach(m=>m.dispose());
    this.r.dispose();try{this.r.forceContextLoss()}catch(_){}
  }
}
</script>

function boardSVG(){
  let q='';const side=63.6,o=(100-side)/2,c=side/8;
  for(let i=0;i<8;i++)for(let j=0;j<8;j++)if((i+j)%2)q+=`<rect x="${(o+i*c).toFixed(2)}" y="${(o+j*c).toFixed(2)}" width="${(c+.05).toFixed(2)}" height="${(c+.05).toFixed(2)}" fill="var(--dsq)"/>`;
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${q}<rect x="${o}" y="${o}" width="${side}" height="${side}" fill="none" stroke="var(--dsq)" stroke-width=".5"/></svg>`;
}
function cardsFaceSVG(){
  const suits=[['♠',0],['♥',90],['♦',180],['♣',270]],R=27,s='font-family:Georgia,"Times New Roman",serif';
  let g='';
  suits.forEach(([sym,ang])=>{
    const rad=ang*Math.PI/180,cx=(50+R*Math.sin(rad)).toFixed(2),cy=(50-R*Math.cos(rad)).toFixed(2);
    g+=`<g transform="translate(${cx} ${cy}) rotate(${ang})"><text x="0" y="0" font-size="12" text-anchor="middle" dominant-baseline="central" style="${s}">${sym}</text></g>`;
  });
  return `<svg viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="50" fill="#2E5D46"/>
    <circle cx="50" cy="50" r="17" fill="none" stroke="#F0E9DE" stroke-width=".6" opacity=".35"/>
    <g fill="#F0E9DE">${g}</g>
    <text x="50" y="51" font-size="5" text-anchor="middle" dominant-baseline="central" fill="#F0E9DE" opacity=".4" style="${s}">✻</text>
  </svg>`;
}

<script>
"use strict";
let viewers=[],unsubs=[],offs=[],timers=[],shown=null,virtual=null,pending=null;
const app=$('#app');
const on=(el,ev,fn,opt)=>{if(!el)return;el.addEventListener(ev,fn,opt);offs.push(()=>el.removeEventListener(ev,fn,opt))};
const later=(fn,ms)=>{const t=setTimeout(fn,ms);timers.push(t);return t};
function cleanup(){viewers.forEach(v=>v.dispose());viewers=[];unsubs.forEach(f=>f());unsubs=[];offs.forEach(f=>f());offs=[];timers.forEach(clearTimeout);timers=[]}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2400)}
function scrollToSel(sel){const el=$(sel);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});else{pending=sel;go('/tuttotondo')}}
function seen(el,fn,once=true){const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){fn();if(once)io.disconnect()}},{threshold:.45});io.observe(el);unsubs.push(()=>io.disconnect())}
function bindViewer(v,extra={}){
  const f=d=>v.setConfig(Object.assign({oak:d.oak,body:d.body,accent:d.accent,surface:cfg.surface},extra));
  f(derived());if(!v.dead){v.cur.body.copy(v.tar.body);v.cur.acc.copy(v.tar.acc)}
  unsubs.push(onCfg(f));
}

  const n=cart.reduce((s,i)=>s+i.qty,0);$('#cartn').textContent=n;

  $('#carttot').textContent=eur(cartTotal());$('#checkout').disabled=!cart.length;
}
function addToCart(){
  const d=derived(),p=priceNow();

  if(ex)ex.qty++;else cart.push({name:'TuttoTondo'+(cfg.finish==='custom'?' Custom':cfg.finish==='natural'?' Natural':''),desc:full,price:p.min,from:p.min!==p.max,img:d.photo,qty:1});

  $$('.sw button',root).forEach(b=>on(b,'click',()=>setCfg({finish:'standard',[b.dataset.k]:b.dataset.c})));
  on($('#ral1'),'input',e=>setCfg({ral1:e.target.value}));on($('#ral2'),'input',e=>setCfg({ral2:e.target.value}));

    const want=cfg.surface!=='none',is=v.flipT!==0;if(!v.dead&&want!==is)v.flip()}));
  const SURF_NAME={none:'Plain',chess:'Chess',cards:'Cards'};
  const refresh=(d,p)=>{
    $('#cfg-name').innerHTML=cfg.finish==='natural'?'Natural oak':`${d.bodyName}<span class="x">×</span>${d.accName}`;
    $$('.tabs button[data-fin]',root).forEach(b=>b.setAttribute('aria-pressed',b.dataset.fin===cfg.finish));
    $('#fin-standard').hidden=cfg.finish!=='standard';$('#fin-custom').hidden=cfg.finish!=='custom';$('#fin-natural').hidden=cfg.finish!=='natural';
    $$('#sw-body button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===cfg.body));
    $$('#sw-acc button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===cfg.accent));
    $('#nm-body').textContent=CMAP[cfg.body].name;$('#nm-acc').textContent=CMAP[cfg.accent].name;
    $('#nm-surface').textContent=SURF_NAME[cfg.surface];
    $$('#surf-tabs button',root).forEach(b=>b.setAttribute('aria-pressed',b.dataset.surf===cfg.surface));
    $('#chip1').style.setProperty('--c',ralHex(cfg.ral1)||'#ccc');$('#chip2').style.setProperty('--c',ralHex(cfg.ral2)||'#ccc');
    const surfLabel=cfg.surface==='chess'?' + chess board':cfg.surface==='cards'?' + cards':'';
    $('#cfg-price').innerHTML=`${p.text}<small>${p.label}${surfLabel}</small>`;
    $('#cfg-fb').src=d.photo;
  };
  unsubs.push(onCfg(refresh));
}
function initAsm(){
  const st=$('#asm-stage');if(!st)return;
  const v=new Viewer(st,{pose:'unpack',interactive:true,auto:false,edgeAcc:true});viewers.push(v);bindViewer(v,{surface:'none',oak:false,...SHOW.cover});
  const steps=$$('#steps li');
  const go=n=>{steps.forEach(li=>li.classList.toggle('on',li.dataset.pose===n));v.setPose(n)};
  const stop=()=>{timers.forEach(clearTimeout);timers=[]};
  steps.forEach(li=>on($('button',li),'click',()=>{stop();go(li.dataset.pose)}));
  const play=()=>{stop();['unpack','slot','assemble','top','final'].forEach((n,i)=>later(()=>go(n),i*2000))};
  on($('#asm-play'),'click',play);
  seen(st,()=>later(play,500));
}
function initRot(){
  const st=$('#rot-stage');if(!st)return;
  const v=new Viewer(st,{pose:'final',interactive:true,phi:.74,theta:.62,edgeAcc:true});viewers.push(v);bindViewer(v,{surface:'none',oak:false,...SHOW.cover});
  on($('#rot-spin'),'click',()=>v.spin());on($('#rot-flip'),'click',()=>v.flip());
  seen(st,()=>{later(()=>v.spin(),700);later(()=>v.flip(),2300)});
}
function initEditions(){
  const g=$('#ed-grid');if(!g)return;
  $$('button',g).forEach(b=>on(b,'click',()=>{setCfg({finish:'standard',body:b.dataset.b,accent:b.dataset.a});scrollToSel('#configurator')}));
  unsubs.push(onCfg(()=>$$('button',g).forEach(b=>b.classList.toggle('on',cfg.finish==='standard'&&b.dataset.b===cfg.body&&b.dataset.a===cfg.accent))));
}
function initChess(){
  const coin=$('#coin');if(!coin)return;
  const back=$('#coin-back'),tabs=$$('#game-tabs button');
  let surf='chess';
  const paint=()=>{back.innerHTML=surf==='chess'?boardSVG():cardsFaceSVG()};
  const t=()=>coin.classList.toggle('flipped');
  on($('#coin-flip'),'click',t);on(coin,'click',t);
  tabs.forEach(b=>on(b,'click',e=>{e.stopPropagation();surf=b.dataset.surf;tabs.forEach(x=>x.setAttribute('aria-pressed',x===b));paint();if(!coin.classList.contains('flipped'))coin.classList.add('flipped')}));
  on($('#chess-add'),'click',()=>{setCfg({surface:surf});toast(`${surf==='chess'?'Chess board':'Cards'} added to your table`);scrollToSel('#configurator')});
  seen(coin,()=>later(()=>coin.classList.add('flipped'),900));
}
function initFinGo(){$$('[data-fin-go]').forEach(b=>on(b,'click',()=>{const f=b.dataset.finGo;if(f==='custom'&&!cfg.ral1&&!cfg.ral2){cfg.ral1='7016';cfg.ral2='6027';const a=$('#ral1'),c=$('#ral2');if(a){a.value='7016';c.value='6027'}}setCfg({finish:f});scrollToSel('#configurator')}))}
function initSheet(){
  const sec=$('#sheet');if(!sec)return;
  const svg=$('svg',sec),A=$('#pt-a'),B=$('#pt-b'),T1=$('#pt-t1'),T2=$('#pt-t2'),dims=$('#sh-dims'),dd=$('#d-dim'),photo=$('.photo',sec),cap=$('#sh-cap'),st=$$('#sh-stages span'),lbs=$$('.lb',svg),cuts=$$('.cut',svg);
  const CAPS=['One sheet. Everything the table needs is drawn inside this rectangle.','One cut line. The curve that shapes each plate is the edge of the round top.','Two plates. One round top. Two small tabs. That is the whole table.','The same parts, coloured. Assembled without a single screw.'];
  let last=-1;
  const upd=()=>{
    const r=sec.getBoundingClientRect(),tot=r.height-window.innerHeight,p=tot>0?clamp(-r.top/tot):0;
    const cut=clamp((p-.18)/.28),sep=ease(clamp((p-.5)/.24)),fill=clamp((p-.76)/.1),ph=clamp((p-.84)/.09);
    cuts.forEach(c=>{c.style.strokeDasharray='1 1';c.style.strokeDashoffset=(1-cut).toFixed(4)});
    A.style.transform=`translate(0px,${(-15*sep).toFixed(2)}px)`;B.style.transform=`translate(0px,${(15*sep).toFixed(2)}px)`;
    T1.style.transform=`translate(${(-13*sep).toFixed(2)}px,${(-22*sep).toFixed(2)}px)`;T2.style.transform=`translate(${(13*sep).toFixed(2)}px,${(22*sep).toFixed(2)}px)`;
    dims.style.opacity=1-clamp((p-.14)/.1);dd.style.opacity=clamp((p-.32)/.1)*(1-clamp((p-.5)/.08));
    const lo=clamp((p-.6)/.08)*(1-clamp((p-.78)/.06));lbs.forEach(l=>l.setAttribute('opacity',lo.toFixed(2)));
    [A,B,T1,T2,$('#pt-d')].forEach(g=>g.style.setProperty('--f',(fill*.95).toFixed(2)));
    svg.style.opacity=(1-ph).toFixed(2);photo.style.opacity=ph.toFixed(2);
    const i=p<.18?0:p<.5?1:p<.86?2:3;
    if(i!==last){last=i;cap.textContent=CAPS[i];st.forEach((s,k)=>s.classList.toggle('on',k===i))}
  };
  on(window,'scroll',upd,{passive:true});on(window,'resize',upd);upd();
}
function initPP(){
  const im=$('#pp-img');if(!im)return;
  unsubs.push(onCfg((d,p)=>{im.src=d.photo;$('#pp-price').innerHTML=`${p.text}<small>${p.label}</small>`}));
  const links=$$('#subnav a'),secs=links.map(a=>$(a.dataset.scroll));
  const spy=()=>{let k=-1;secs.forEach((s,i)=>{if(s&&s.getBoundingClientRect().top<window.innerHeight*.35)k=i});links.forEach((a,i)=>a.classList.toggle('on',i===k));if(k>=0){const a=links[k],sn=$('#subnav');sn.scrollTo?.({left:a.offsetLeft-24,behavior:'auto'})}};
  on(window,'scroll',spy,{passive:true});spy();
}
function initOrder(){
  const o=$('#order');if(!o)return;
  unsubs.push(onCfg((d,p)=>{const sl=cfg.surface==='chess'?' · chess board':cfg.surface==='cards'?' · cards':'';$('#ord-desc').textContent=`${d.name}${sl} · Ø 60 × 40 cm`;$('#ord-price').innerHTML=`${p.text}<small>${p.label}</small>`}));
  on($('#ord-add'),'click',addToCart);
}
function initContact(){
  const f=$('#cform');if(!f)return;
  on(f,'submit',e=>{e.preventDefault();$('#cmsg').textContent='Thank you. This is a draft site, so the form is not connected yet and nothing was sent.';f.reset()});
}

/* ---------- router ---------- */
const validPath=p=>PAGES[p]?p:'/';
function currentPath(){return validPath(virtual??((location.hash||'#/').slice(1)||'/'))}
function go(path){
  if(currentPath()===path&&shown===path){window.scrollTo({top:0,behavior:'smooth'});$('#nav').classList.remove('open');return}
  virtual=path;try{location.hash='#'+path}catch(_){}
  if(shown!==path)render();
}
function render(){
  const path=currentPath();cleanup();shown=path;
  app.innerHTML=PAGES[path]();$('#foot').innerHTML=footer();
  $$('.nav-links a').forEach(a=>a.classList.toggle('on',a.dataset.link===path));
  $('#nav').classList.remove('open');$('#menubtn').setAttribute('aria-expanded','false');
  $$('[data-p]').forEach(e=>e.textContent=pr(e.dataset.p));
  initHome();initSheet();initCfg();initAsm();initRot();initEditions();initChess();initFinGo();initPP();initOrder();initContact();
  applyCfg();window.scrollTo(0,0);
  if(pending){const s=pending;pending=null;setTimeout(()=>scrollToSel(s),120)}
}

/* ---------- boot ---------- */
$('#brand-logo').innerHTML=LOGO(1.7);
onCfg(d=>document.documentElement.style.setProperty('--dsq',d.oak?'#A47C4C':d.body));
document.addEventListener('click',e=>{
  const l=e.target.closest('[data-link]');if(l){e.preventDefault();go(l.dataset.link);return}
  const s=e.target.closest('[data-scroll]');if(s){e.preventDefault();scrollToSel(s.dataset.scroll);return}
  const r=e.target.closest('[data-rm]');if(r){cart.splice(+r.dataset.rm,1);renderCart()}
});
window.addEventListener('hashchange',()=>{virtual=null;if(currentPath()!==shown)render()});
window.addEventListener('scroll',()=>$('#nav').classList.toggle('scrolled',window.scrollY>8),{passive:true});
$('#cartbtn').addEventListener('click',()=>document.body.classList.add('cart-open'));
$('#cartclose').addEventListener('click',()=>document.body.classList.remove('cart-open'));
$('#veil').addEventListener('click',()=>document.body.classList.remove('cart-open'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('cart-open')});
$('#menubtn').addEventListener('click',()=>{const o=$('#nav').classList.toggle('open');$('#menubtn').setAttribute('aria-expanded',o)});
$('#checkout').addEventListener('click',()=>{$('#checkmsg').textContent='Draft site: checkout is not connected yet. Nothing was charged.'});
renderCart();render();
</script>

</body></html>
